<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body {
    font-family: "Noto Sans Devanagari", Arial;
    font-size: 12px;
    margin: 0;
  }

  .container {
    padding: 15px 25px;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    position: relative;
    border-bottom: 1px solid #000;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }

  .logo {
    position: absolute;
    left: 0;
    top: 0;
  }

  .logo img {
    height: 55px;
  }

  .title h2 {
    margin: 0;
    font-size: 16px;
    font-weight: bold;
  }

  .title h3 {
    margin: 4px 0;
    font-size: 14px;
  }

  .info {
    text-align: center;
    font-size: 12px;
    margin-top: 5px;
  }

  /* ===== TABLE ===== */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th, td {
    border: 1px solid #000;
    padding: 6px;
  }

  th {
    background: #eee;
    font-weight: bold;
  }

  td {
    word-break: break-word;
  }

  .right {
    text-align: right;
  }

  .center {
    text-align: center;
  }

  .total-row td {
    font-weight: bold;
  }

  .footer {
    margin-top: 15px;
    text-align: right;
    font-size: 11px;
  }
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <img src="{{logo}}" />
    </div>

    <div class="title">
      <h2>{{corporationName}}</h2>
      <h3>पेमेंट रजिस्टर  {{rptType}}</h3>
    </div>
  </div>

  <!-- INFO -->
  <div class="info">
    अहवालाचा कालावधी दिनांक : {{fromDate}} पासून {{toDate}} पर्यंत
  </div>

  <div class="info">
    झोन : {{zoneName}}
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>मेजर</th>
        <th>मेजर नाव</th>
        <th class="right">रक्कम</th>
      </tr>
    </thead>

    <tbody>
      {{#each rows}}
      <tr>
        <td class="center">{{glcode}}</td>
        <td class="center">{{accname}}</td>
        <td class="right">{{amountFormatted}}</td>
      </tr>
      {{/each}}

      <tr class="total-row">
        <td colspan="2" class="right">एकूण :</td>
        <td class="right">{{total}}</td>
      </tr>
    </tbody>
  </table>

  <!-- FOOTER -->
  <div class="footer">
    छापण्याची तारीख : {{currentDate}}
  </div>

</div>

</body>
</html>
